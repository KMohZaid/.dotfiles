# Application bindings
$terminal = uwsm-app -- kitty
$browser = omarchy-launch-browser

# Browser workspace rule - auto-launch browser on workspace 2
workspace=2,on-created-empty:~/.config/hypr/scripts/ensure_one_run.sh zen-browser # make script to get list of cmdd to try if first one fails

bindd = SUPER, RETURN, Terminal, exec, $terminal --working-directory="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, $browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, omarchy-launch-tui btop
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus signal "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus "^obsidian$" "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu


# ====================== My Custom ======================

# Switch workspaces with SUPER + [1-9]
bindd = SUPER, code:10, Switch to workspace 1, workspace, 1
bindd = SUPER, code:11, Switch to workspace 2, workspace, 2
bindd = SUPER, code:12, Switch to workspace 3, workspace, 3
bindd = SUPER, code:13, Switch to workspace 4, workspace, 4
bindd = SUPER, code:14, Switch to workspace 5, workspace, 5
bindd = SUPER, code:15, Switch to workspace 6, workspace, 6
bindd = SUPER, code:16, Switch to workspace 7, workspace, 7
bindd = SUPER, code:17, Switch to workspace 8, workspace, 8
bindd = SUPER, code:18, Switch to workspace 9, workspace, 9
bindd = SUPER, code:19, Switch to workspace 10, workspace, 10

# Move active window to a workspace with SUPER + SHIFT + [1-9]
bindd = SUPER SHIFT, code:10, Move window to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, code:11, Move window to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, code:12, Move window to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, code:13, Move window to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, code:14, Move window to workspace 5, movetoworkspace, 5
bindd = SUPER SHIFT, code:15, Move window to workspace 6, movetoworkspace, 6
bindd = SUPER SHIFT, code:16, Move window to workspace 7, movetoworkspace, 7
bindd = SUPER SHIFT, code:17, Move window to workspace 8, movetoworkspace, 8
bindd = SUPER SHIFT, code:18, Move window to workspace 9, movetoworkspace, 9
bindd = SUPER SHIFT, code:19, Move window to workspace 10, movetoworkspace, 10


# change the window close to Q from W
unbind = SUPER, W
bindd = SUPER, Q, Close window, killactive

# Move/Switch to special workspace (scratchpad)
# Example special workspace (scratchpad)
unbind = SUPER, S
bind = SUPER, S, togglespecialworkspace, magic
bind = SUPER SHIFT, S, movetoworkspace, special:magic


# Resize windows
unbind = SUPER SHIFT, RIGHT
unbind = SUPER SHIFT, LEFT
unbind = SUPER SHIFT, UP
unbind = SUPER SHIFT, DOWN
binde = SUPER SHIFT, RIGHT, resizeactive, 30 0
binde = SUPER SHIFT, LEFT, resizeactive, -30 0
binde = SUPER SHIFT, UP, resizeactive, 0 -30
binde = SUPER SHIFT, DOWN, resizeactive, 0 30


# Media control
# # Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bind = SUPER, Escape, exec, playerctl play-pause # pause/play media, for laptop

binds = ALT_R, Right, exec, playerctl next # next media with right alt and right arrow, for laptop
binds = ALT_R, Left, exec, playerctl previous # previous media with right alt and left arrow, for laptop
binds = ALT_R, Escape, exec, playerctl play-pause # pause/play media with right alt and escape, for laptop


# ====================== Additional Custom Bindings ======================

# Additional application shortcuts (merged from nixos-dotfiles)
$file = nautilus
$editor = code
bind = SUPER, E, exec, $file # launch file manager
bind = SUPER, C, exec, $editor # launch text editor
bind = CTRL SHIFT, Escape, exec, btop

# Move active window around workspace with SUPER + SHIFT + CTRL + arrows
$moveactivewindow=grep -q "true" <<< $(hyprctl activewindow -j | jq -r .floating) && hyprctl dispatch moveactive
binded = SUPER SHIFT CTRL, left, Move activewindow to the left, exec, $moveactivewindow -30 0 || hyprctl dispatch movewindow l
binded = SUPER SHIFT CTRL, right, Move activewindow to the right, exec, $moveactivewindow 30 0 || hyprctl dispatch movewindow r
binded = SUPER SHIFT CTRL, up, Move activewindow up, exec, $moveactivewindow  0 -30 || hyprctl dispatch movewindow u
binded = SUPER SHIFT CTRL, down, Move activewindow down, exec, $moveactivewindow 0 30 || hyprctl dispatch movewindow d

# Move focused window to workspace silently
bind = SUPER ALT, code:10, movetoworkspacesilent, 1
bind = SUPER ALT, code:11, movetoworkspacesilent, 2
bind = SUPER ALT, code:12, movetoworkspacesilent, 3
bind = SUPER ALT, code:13, movetoworkspacesilent, 4
bind = SUPER ALT, code:14, movetoworkspacesilent, 5
bind = SUPER ALT, code:15, movetoworkspacesilent, 6
bind = SUPER ALT, code:16, movetoworkspacesilent, 7
bind = SUPER ALT, code:17, movetoworkspacesilent, 8
bind = SUPER ALT, code:18, movetoworkspacesilent, 9
bind = SUPER ALT, code:19, movetoworkspacesilent, 10


# TODO: Integrate caelestia properly
# TODO: set caelestia windrules in windrules.conf

unbind = SUPER, SPACE
bind = SUPER, Space, global, caelestia:launcher


