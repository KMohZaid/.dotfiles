# ====================== Caelestia Bindings ======================

# ## Shell keybinds
# Launcher
bindd = Super, Space, Open Noctalias launcher, exec, qs -c noctalia-shell ipc call launcher toggle

# Misc
bindd = Ctrl+Alt, Delete, Open session menu, exec, qs -c noctalia-shell ipc call sessionMenu toggle
bindd = Super+Shift, P, Show all windows, global, caelestia:showall # TODO: remove this or change to dms one
bindd = Super, L, Lock screen, exec, qs -c noctalia-shell ipc call sessionMenu lock
bindl = ,switch:off:Lid Switch, exec, qs -c noctalia-shell ipc call sessionMenu lock # lock screen when lid close # XXX: systemd-login have sleep disable on lid close because of ssd fialure issues.....

# Switch focus to previously focused window (Alt + Tab behavior)
bindd = ALT, Tab, Switch focus to previously focused window, focuscurrentorlast

#  Discord/Vesktop/Equibop push-to-talk
bindd = ,F12, Discord/Vesktop Push-To-Talk, pass, class:^(equibop|discord|vesktop)

#  Voice Dictation Toggle with voxtype
bindd = Super, D, Voice Dictation Toggle (voxtype), exec, voxtype record toggle --type # simulate typing


# Restore lock # TODO: why it is needed? # TODO: change to dms one
bindld = Super Alt, L, Restore Caelestia shell, exec, $caelestiaStarter 
bindld = Super Alt, L, Lock screen (restore), global, caelestia:lock

# Media
# TODO: make variables for all dms commands like ipc calls, launcher, etc so in future it is changable
# TODO: organize and add description
bindld = Ctrl+Super, Space, Toggle media playback, exec, qs -c noctalia-shell ipc call media playPause
bindld = Ctrl+Super, Equal, Next media track, exec, qs -c noctalia-shell ipc call media next
bindld = Ctrl+Super, Minus, Previous media track, exec, qs -c noctalia-shell ipc call media previous

bindld = , XF86AudioPlay, Toggle media playback, exec, qs -c noctalia-shell ipc call media playPause
bindld = , XF86AudioPause, Toggle media playback, exec, qs -c noctalia-shell ipc call media playPause
bindld = , XF86AudioNext, Next media track, exec, qs -c noctalia-shell ipc call media next
bindld = , XF86AudioPrev, Previous media track, exec, qs -c noctalia-shell ipc call media previous
bindld = , XF86AudioStop, Stop media playback, exec, qs -c noctalia-shell ipc call media stop

# Restart DMS shell
bindrd = Ctrl+Super+Alt, R, Restart DMS shell, exec, dms restart

# Window actions
bindd = Super, left, Move focus left, movefocus, l
bindd = Super, right, Move focus right, movefocus, r
bindd = Super, up, Move focus up, movefocus, u
bindd = Super, down, Move focus down, movefocus, d
# TODO: fix this, splitratio dispatcher is wrong now
#binded = Super, Minus, Decrease split ratio, splitratio, -0.1
#binded = Super, Equal, Increase split ratio, splitratio, 0.1
bindmd = Super, mouse:272, Move window with mouse, movewindow
bindmd = Super, Z, Move window with Z key, movewindow

## resize window with mouse
bindmd = Super, mouse:273, Resize window with mouse, resizewindow
bindmd = Super, X, Resize window with X key, resizewindow

## resize window with keyboard
binded = Super+Shift, left, Resize window left, resizeactive, -1% 0 # left
binded = Super+Shift, right, Resize window right, resizeactive, 1% 0 # right
binded = Super+Shift, up, Resize window up, resizeactive, 0 -1% # up
binded = Super+Shift, down, Resize window down, resizeactive, 0 1% # down

bindd = Ctrl+Super, Backslash, Center window, centerwindow, 1
bindd = Ctrl+Super+Alt, Backslash, Resize window to 55% x 70%, resizeactive, exact 55% 70%
bindd = Ctrl+Super+Alt, Backslash, Center resized window, centerwindow, 1
bindd = Super+Alt, Backslash, Picture-in-picture mode, exec, caelestia resizer pip  # Move window to picture-in-picture mode # TODO: change to dms one or custom script
bindd = Super, P, Pin window, pin
bindd = Super, F, Fullscreen window, fullscreen, 0
bindd = Super+Alt, F, Fullscreen with borders, fullscreen, 1  # Fullscreen with borders
bindd = Super+Alt, Space, Toggle floating window, togglefloating, # TODO: Change to Super+Alt Space
bindd = SUPER, Q, Close window, killactive

# Apps
bindd = SUPER, RETURN, Terminal, exec, app2unit -- kitty --working-directory="$(omarchy-cmd-terminal-cwd)" #TODO: remove omarchy
# TODO: use below keybinds
bindd = Super, W, Switch to browser workspace, workspace, 2 # Move to browser workspace # TODO: use proper browser launch
bindd = Super, C, Open editor, exec, app2unit -- $editor
$fileExplorer = nautilus # TODO: move to variables.conf
bindd = Super, E, Open file explorer, exec, app2unit -- $fileExplorer
bindd = Ctrl+Alt, Escape, Open btop in terminal, exec, kitty btop
bindd = Ctrl+Alt, V, Open audio control panel, exec, app2unit -- pavucontrol

# Screenshots and screen recording
# TODO: organize and add description, maybe change to good keybinds

# dispabled those because of trying other one
bindld = , Print, Capture full screen to clipboard, exec, flameshot full --clipboard # Full screen capture > clipboard
bindd = Super, Print, Capture region, exec, flameshot gui # Region capture
bindd = Super+Shift, C, Color picker, exec, hyprpicker -a  # Colour picker

# XXX: trying out different screenshot process :

# Fullscreen capture(first monitor) -> Clipboard
#bindld = , Print, Capture full screen to clipboard, exec, hyprshot -m output -m "$(hyprctl monitors | awk '/Monitor/{print $2}' | head -n1)" --clipboard-only

# Region capture (Frozen) -> Clipboard
#bindd = Super, Print, Capture region to clipboard, exec, hyprshot -m region --freeze --clipboard-only

# Select Window to capture -> Clipboard
bindd = ALT, Print, Capture active window to clipboard, exec, hyprshot -m window --clipboard-only

# Open current clipboard image in Satty for smooth blurs & annotations
bindd = Super_L SHIFT, Print, Edit clipboard image in satty, exec, wl-paste -t image/png | GTK_THEME=Adwaita:dark satty --filename -

# TODO: maybe enable recording in future? i guess obs is good for now
# bind = Super+Alt, R, exec, caelestia record -s  # Record screen with sound
# bind = Ctrl+Alt, R, exec, caelestia record  # Record screen
# bind = Super+Shift+Alt, R, exec, caelestia record -r  # Record region

# Brightness
bindld = , XF86MonBrightnessUp, Increase brightness, exec, brightnessctl set +5%
bindld = , XF86MonBrightnessDown, Decrease brightness, exec, brightnessctl set 5%-

# Volume
bindld = , XF86AudioMicMute, Toggle microphone mute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindld = , XF86AudioMute, Toggle audio mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
$volumeUnmuteCmd = wpctl set-mute @DEFAULT_AUDIO_SINK@ 0
$volumeStep = 5
bindled = , XF86AudioRaiseVolume, Increase volume, exec, $volumeUnmuteCmd; wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ $volumeStep%+
bindled = , XF86AudioLowerVolume, Decrease volume, exec, $volumeUnmuteCmd; wpctl set-volume @DEFAULT_AUDIO_SINK@ $volumeStep%-

# Precise 1% multimedia adjustments with Alt modifier
bindeld = ALT, XF86AudioRaiseVolume, Volume up precise, exec, $volumeUnmuteCmd; wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 1%+
bindeld = ALT, XF86AudioLowerVolume, Volume down precise, exec, $volumeUnmuteCmd; wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-


# Sleep TODO: use this
# bind = Super+Shift, L, exec, systemctl suspend-then-hibernate


# Clipboard, Emoji picker, Walker Launcher and Menus
bindd = Super, V, Clipboard manager, exec, qs -c noctalia-shell ipc call launcher clipboard # Clipboard manager
bindd = Super, Period, Emoji/Symbols picker, exec, qs -c noctalia-shell ipc call launcher emoji  # Emoji picker
bindd = Alt, Space, Open walker launcher, exec, walker
bindd = SUPER, K, Show key bindings, exec, ~/.config/hypr/scripts/walker-keybinds



# ===================== Omarchy keybinds moved here =====================

# ========= Tiling =========
# TAB between workspaces # TODO: good keybinds
bindd = SUPER, TAB, Next workspace, workspace, e+1
bindd = SUPER SHIFT, TAB, Previous workspace, workspace, e-1
bindd = SUPER CTRL, TAB, Former workspace, workspace, previous

# TODO: try out groups

# Toggle groups
bindd = SUPER, G, Toggle window grouping, togglegroup
bindd = SUPER ALT, G, Move active window out of group, moveoutofgroup

# Join groups
bindd = SUPER ALT, LEFT, Move window to group on left, moveintogroup, l
bindd = SUPER ALT, RIGHT, Move window to group on right, moveintogroup, r
bindd = SUPER ALT, UP, Move window to group on top, moveintogroup, u
bindd = SUPER ALT, DOWN, Move window to group on bottom, moveintogroup, d

# Navigate a single set of grouped windows
bindd = SUPER ALT, TAB, Next window in group, changegroupactive, f
bindd = SUPER ALT SHIFT, TAB, Previous window in group, changegroupactive, b

# Window navigation for grouped windows
bindd = SUPER CTRL, LEFT, Move grouped window focus left, changegroupactive, b
bindd = SUPER CTRL, RIGHT, Move grouped window focus right, changegroupactive, f

# Scroll through a set of grouped windows with SUPER + ALT + scroll
bindd = SUPER ALT, mouse_down, Next window in group, changegroupactive, f
bindd = SUPER ALT, mouse_up, Previous window in group, changegroupactive, b

# Activate window in a group by number
bindd = SUPER ALT, code:10, Switch to group window 1, changegroupactive, 1
bindd = SUPER ALT, code:11, Switch to group window 2, changegroupactive, 2
bindd = SUPER ALT, code:12, Switch to group window 3, changegroupactive, 3
bindd = SUPER ALT, code:13, Switch to group window 4, changegroupactive, 4
bindd = SUPER ALT, code:14, Switch to group window 5, changegroupactive, 5

