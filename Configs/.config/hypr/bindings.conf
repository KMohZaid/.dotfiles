# Application bindings
$browser = omarchy-launch-browser

# Browser workspace rule - auto-launch browser on workspace 2
workspace=2,on-created-empty:$browser # make script to get list of cmdd to try if first one fails

# ====================== My Custom ======================

# Switch workspaces with SUPER + [1-9]
bindd = SUPER, 1, Switch to workspace 1, workspace, 1
bindd = SUPER, 2, Switch to workspace 2, workspace, 2
bindd = SUPER, 3, Switch to workspace 3, workspace, 3
bindd = SUPER, 4, Switch to workspace 4, workspace, 4
bindd = SUPER, 5, Switch to workspace 5, workspace, 5
bindd = SUPER, 6, Switch to workspace 6, workspace, 6
bindd = SUPER, 7, Switch to workspace 7, workspace, 7
bindd = SUPER, 8, Switch to workspace 8, workspace, 8
bindd = SUPER, 9, Switch to workspace 9, workspace, 9
bindd = SUPER, 0, Switch to workspace 10, workspace, 10

# Move active window to a workspace with SUPER + SHIFT + [1-9]
bindd = SUPER SHIFT, 1, Move window to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, 2, Move window to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, 3, Move window to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, 4, Move window to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, 5, Move window to workspace 5, movetoworkspace, 5
bindd = SUPER SHIFT, 6, Move window to workspace 6, movetoworkspace, 6
bindd = SUPER SHIFT, 7, Move window to workspace 7, movetoworkspace, 7
bindd = SUPER SHIFT, 8, Move window to workspace 8, movetoworkspace, 8
bindd = SUPER SHIFT, 9, Move window to workspace 9, movetoworkspace, 9
bindd = SUPER SHIFT, 0, Move window to workspace 10, movetoworkspace, 10



# Move/Switch to special workspace (scratchpad)
# Example special workspace (scratchpad)
bind = SUPER, S, togglespecialworkspace, magic
bind = SUPER SHIFT, S, movetoworkspace, special:magic



# Media control
# # Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bind = SUPER, Escape, exec, playerctl play-pause # pause/play media, for laptop

binds = ALT_R, Right, exec, playerctl next # next media with right alt and right arrow, for laptop
binds = ALT_R, Left, exec, playerctl previous # previous media with right alt and left arrow, for laptop
binds = ALT_R, Escape, exec, playerctl play-pause # pause/play media with right alt and escape, for laptop


# ====================== Additional Custom Bindings ======================

# Additional application shortcuts (merged from nixos-dotfiles)
bind = CTRL SHIFT, Escape, exec, btop

# Move active window around workspace with SUPER + SHIFT + CTRL + arrows
$moveactivewindow=grep -q "true" <<< $(hyprctl activewindow -j | jq -r .floating) && hyprctl dispatch moveactive
binded = SUPER SHIFT CTRL, left, Move activewindow to the left, exec, $moveactivewindow -30 0 || hyprctl dispatch movewindow l
binded = SUPER SHIFT CTRL, right, Move activewindow to the right, exec, $moveactivewindow 30 0 || hyprctl dispatch movewindow r
binded = SUPER SHIFT CTRL, up, Move activewindow up, exec, $moveactivewindow  0 -30 || hyprctl dispatch movewindow u
binded = SUPER SHIFT CTRL, down, Move activewindow down, exec, $moveactivewindow 0 30 || hyprctl dispatch movewindow d

# Move focused window to workspace silently
bind = SUPER ALT, 1, movetoworkspacesilent, 1
bind = SUPER ALT, 2, movetoworkspacesilent, 2
bind = SUPER ALT, 3, movetoworkspacesilent, 3
bind = SUPER ALT, 4, movetoworkspacesilent, 4
bind = SUPER ALT, 5, movetoworkspacesilent, 5
bind = SUPER ALT, 6, movetoworkspacesilent, 6
bind = SUPER ALT, 7, movetoworkspacesilent, 7
bind = SUPER ALT, 8, movetoworkspacesilent, 8
bind = SUPER ALT, 9, movetoworkspacesilent, 9
bind = SUPER ALT, 0, movetoworkspacesilent, 10


# TODO: Integrate caelestia properly
# TODO: set caelestia windrules in windrules.conf
# ====================== Caelestia Bindings ======================

exec = hyprctl dispatch submap global
submap = global

# ## Shell keybinds
# Launcher
bind = Super, Space, global, caelestia:launcher

# Misc
bind = Ctrl+Alt, Delete, global, caelestia:session
bindl = Ctrl+Alt, C , global, caelestia:clearNotifs
bind = Super+Shift, P, global, caelestia:showall
bind = Super, L, global, caelestia:lock

# Restore lock # TODO: why it is needed?
bindl = Super Alt, L, exec, caelestia shell -d
bindl = Super Alt, L, global, caelestia:lock

# Brightness
bindl = , XF86MonBrightnessUp, global, caelestia:brightnessUp
bindl = , XF86MonBrightnessDown, global, caelestia:brightnessDown

# Media
# TODO: organize and add description
bindl = Ctrl+Super, Space, global, caelestia:mediaToggle
bindl = Ctrl+Super, Equal, global, caelestia:mediaNext
bindl = Ctrl+Super, Minus, global, caelestia:mediaPrev

bindl = , XF86AudioPlay, global, caelestia:mediaToggle
bindl = , XF86AudioPause, global, caelestia:mediaToggle
bindl = , XF86AudioNext, global, caelestia:mediaNext
bindl = , XF86AudioPrev, global, caelestia:mediaPrev
bindl = , XF86AudioStop, global, caelestia:mediaStop

# Restart caelestia
bindr = Ctrl+Super+Alt, R, exec, qs -c caelestia kill;sleep 0.1; caelestia shell -d

# Window actions
bind = Super, left, movefocus, l
bind = Super, right, movefocus, r
bind = Super, up, movefocus, u
bind = Super, down, movefocus, d
bind = Super+Shift, left, movewindow, l
bind = Super+Shift, right, movewindow, r
bind = Super+Shift, up, movewindow, u
bind = Super+Shift, down, movewindow, d
binde = Super, Minus, splitratio, -0.1
binde = Super, Equal, splitratio, 0.1
bindm = Super, mouse:272, movewindow
bindm = Super, Z, movewindow
bindm = Super, mouse:273, resizewindow
bindm = Super, X, resizewindow
bind = Ctrl+Super, Backslash, centerwindow, 1
bind = Ctrl+Super+Alt, Backslash, resizeactive, exact 55% 70%
bind = Ctrl+Super+Alt, Backslash, centerwindow, 1
bind = Super+Alt, Backslash, exec, caelestia resizer pip  # Move window to picture-in-picture mode
bind = Super, P, pin
bind = Super, F, fullscreen, 0
bind = Super+Alt, F, fullscreen, 1  # Fullscreen with borders
bind = Super+Alt, Space, togglefloating, # TODO: Change to Super+Alt Space
bindd = SUPER, Q, Close window, killactive

# Special workspace toggles
bind = Ctrl+Shift, Escape, exec, caelestia toggle sysmon
bind = Super, M, exec, caelestia toggle music
bind = Super, D, exec, caelestia toggle communication
bind = Super, R, exec, caelestia toggle todo

# Apps
bindd = SUPER, RETURN, Terminal, exec, app2unit -- kitty --working-directory="$(omarchy-cmd-terminal-cwd)" #TODO: remove omarchy
# TODO: use below keybinds
bind = Super, W, workspace, 2 # Move to browser workspace # TODO: use proper browser launch
bind = Super, C, exec, app2unit -- $editor
$fileExplorer = nautilus # TODO: move to variables.conf
bind = Super, E, exec, app2unit -- $fileExplorer
bind = Ctrl+Alt, Escape, exec, kitty btop
bind = Ctrl+Alt, V, exec, app2unit -- pavucontrol

# Screenshots and screen recording
# TODO: organize and add description, maybe change to good keybinds
bindl = , Print, exec, caelestia screenshot  # Full screen capture > clipboard
bind = Super, Print, global, caelestia:screenshotFreeze  # Capture region (freeze)
bind = Super+Shift, Print, global, caelestia:screenshot  # Capture region
bind = Super+Shift, C, exec, hyprpicker -a  # Colour picker

# TODO: maybe enable recording in future? i guess obs is good for now
# bind = Super+Alt, R, exec, caelestia record -s  # Record screen with sound
# bind = Ctrl+Alt, R, exec, caelestia record  # Record screen
# bind = Super+Shift+Alt, R, exec, caelestia record -r  # Record region

# Volume
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
$volumeUnmuteCmd = wpctl set-mute @DEFAULT_AUDIO_SINK@ 0
$volumeStep = 5
bindle = , XF86AudioRaiseVolume, exec, $volumeUnmuteCmd; wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ $volumeStep%+
bindle = , XF86AudioLowerVolume, exec, $volumeUnmuteCmd; wpctl set-volume @DEFAULT_AUDIO_SINK@ $volumeStep%-

# Precise 1% multimedia adjustments with Alt modifier
bindeld = ALT, XF86AudioRaiseVolume, Volume up precise, exec, $volumeUnmuteCmd; wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 1%+
bindeld = ALT, XF86AudioLowerVolume, Volume down precise, exec, $volumeUnmuteCmd; wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-


# Sleep TODO: use this
# bind = Super+Shift, L, exec, systemctl suspend-then-hibernate


# Clipboard, Emoji picker, Walker Launcher and Menus
bindd = Super, V, Clipboard manager, exec, walker -m clipboard # Clipboard manager
bindd = Super, Period, Emoji/Symbols picker, exec, walker -m symbols  # Emoji picker
bindd = Alt, Space, Open walker launcher, exec, walker
bindd = SUPER, K, Show key bindings, exec, ~/.config/hypr/scripts/walker-keybinds



# ===================== Omarchy keybinds moved here =====================

# ========= Tiling =========
# TAB between workspaces # TODO: good keybinds
bindd = SUPER, TAB, Next workspace, workspace, e+1
bindd = SUPER SHIFT, TAB, Previous workspace, workspace, e-1
bindd = SUPER CTRL, TAB, Former workspace, workspace, previous

# TODO: try out groups

# Toggle groups
bindd = SUPER, G, Toggle window grouping, togglegroup
bindd = SUPER ALT, G, Move active window out of group, moveoutofgroup

# Join groups
bindd = SUPER ALT, LEFT, Move window to group on left, moveintogroup, l
bindd = SUPER ALT, RIGHT, Move window to group on right, moveintogroup, r
bindd = SUPER ALT, UP, Move window to group on top, moveintogroup, u
bindd = SUPER ALT, DOWN, Move window to group on bottom, moveintogroup, d

# Navigate a single set of grouped windows
bindd = SUPER ALT, TAB, Next window in group, changegroupactive, f
bindd = SUPER ALT SHIFT, TAB, Previous window in group, changegroupactive, b

# Window navigation for grouped windows
bindd = SUPER CTRL, LEFT, Move grouped window focus left, changegroupactive, b
bindd = SUPER CTRL, RIGHT, Move grouped window focus right, changegroupactive, f

# Scroll through a set of grouped windows with SUPER + ALT + scroll
bindd = SUPER ALT, mouse_down, Next window in group, changegroupactive, f
bindd = SUPER ALT, mouse_up, Previous window in group, changegroupactive, b

# Activate window in a group by number
bindd = SUPER ALT, code:10, Switch to group window 1, changegroupactive, 1
bindd = SUPER ALT, code:11, Switch to group window 2, changegroupactive, 2
bindd = SUPER ALT, code:12, Switch to group window 3, changegroupactive, 3
bindd = SUPER ALT, code:13, Switch to group window 4, changegroupactive, 4
bindd = SUPER ALT, code:14, Switch to group window 5, changegroupactive, 5

# XXX: Group ends


# ========= Utilities =========

# Aesthetics # TODO: hmm maybe change keybinds
bindd = SUPER, BACKSPACE, Toggle window transparency, exec, hyprctl dispatch setprop "address:$(hyprctl activewindow -j | jq -r '.address')" opaque toggle
bindd = SUPER SHIFT, BACKSPACE, Toggle workspace gaps, exec, omarchy-hyprland-workspace-toggle-gaps

# Toggle nightlight # TODO: useful i guess, just need to remove omarchy
bindd = SUPER CTRL, N, Toggle nightlight, exec, omarchy-toggle-nightlight
