# Application bindings
$browser = omarchy-launch-browser

# Browser workspace rule - auto-launch browser on workspace 2
workspace=2,on-created-empty:$browser # make script to get list of cmdd to try if first one fails

# ====================== My Custom ======================

# Switch workspaces with SUPER + [1-9]
bindd = SUPER, 1, Switch to workspace 1, workspace, 1
bindd = SUPER, 2, Switch to workspace 2, workspace, 2
bindd = SUPER, 3, Switch to workspace 3, workspace, 3
bindd = SUPER, 4, Switch to workspace 4, workspace, 4
bindd = SUPER, 5, Switch to workspace 5, workspace, 5
bindd = SUPER, 6, Switch to workspace 6, workspace, 6
bindd = SUPER, 7, Switch to workspace 7, workspace, 7
bindd = SUPER, 8, Switch to workspace 8, workspace, 8
bindd = SUPER, 9, Switch to workspace 9, workspace, 9
bindd = SUPER, 0, Switch to workspace 10, workspace, 10

# Move active window to a workspace with SUPER + SHIFT + [1-9]
bindd = SUPER SHIFT, 1, Move window to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, 2, Move window to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, 3, Move window to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, 4, Move window to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, 5, Move window to workspace 5, movetoworkspace, 5
bindd = SUPER SHIFT, 6, Move window to workspace 6, movetoworkspace, 6
bindd = SUPER SHIFT, 7, Move window to workspace 7, movetoworkspace, 7
bindd = SUPER SHIFT, 8, Move window to workspace 8, movetoworkspace, 8
bindd = SUPER SHIFT, 9, Move window to workspace 9, movetoworkspace, 9
bindd = SUPER SHIFT, 0, Move window to workspace 10, movetoworkspace, 10



# Move/Switch to special workspace (scratchpad)
# Example special workspace (scratchpad)
bindd = SUPER, S, Toggle scratchpad workspace, togglespecialworkspace, magic
bindd = SUPER SHIFT, S, Move window to scratchpad, movetoworkspace, special:magic



# Media control
# # Requires playerctl
bindld = , XF86AudioNext, Next media track, exec, playerctl next
bindld = , XF86AudioPause, Pause media, exec, playerctl play-pause
bindld = , XF86AudioPlay, Play media, exec, playerctl play-pause
bindld = , XF86AudioPrev, Previous media track, exec, playerctl previous
bindd = SUPER, Escape, Toggle media play/pause, exec, playerctl play-pause # pause/play media, for laptop

bindsd = ALT_R, Right, Next media track (laptop), exec, playerctl next # next media with right alt and right arrow, for laptop
bindsd = ALT_R, Left, Previous media track (laptop), exec, playerctl previous # previous media with right alt and left arrow, for laptop
bindsd = ALT_R, Escape, Toggle media play/pause (laptop), exec, playerctl play-pause # pause/play media with right alt and escape, for laptop


# ====================== Additional Custom Bindings ======================

# Additional application shortcuts (merged from nixos-dotfiles)
bindd = CTRL SHIFT, Escape, Open btop system monitor, exec, btop

# Move active window around workspace with SUPER + SHIFT + CTRL + arrows
$moveactivewindow=grep -q "true" <<< $(hyprctl activewindow -j | jq -r .floating) && hyprctl dispatch moveactive
binded = SUPER SHIFT CTRL, left, Move activewindow to the left, exec, $moveactivewindow -30 0 || hyprctl dispatch movewindow l
binded = SUPER SHIFT CTRL, right, Move activewindow to the right, exec, $moveactivewindow 30 0 || hyprctl dispatch movewindow r
binded = SUPER SHIFT CTRL, up, Move activewindow up, exec, $moveactivewindow  0 -30 || hyprctl dispatch movewindow u
binded = SUPER SHIFT CTRL, down, Move activewindow down, exec, $moveactivewindow 0 30 || hyprctl dispatch movewindow d

# Move focused window to workspace silently
bindd = SUPER ALT, 1, Move window to workspace 1 silently, movetoworkspacesilent, 1
bindd = SUPER ALT, 2, Move window to workspace 2 silently, movetoworkspacesilent, 2
bindd = SUPER ALT, 3, Move window to workspace 3 silently, movetoworkspacesilent, 3
bindd = SUPER ALT, 4, Move window to workspace 4 silently, movetoworkspacesilent, 4
bindd = SUPER ALT, 5, Move window to workspace 5 silently, movetoworkspacesilent, 5
bindd = SUPER ALT, 6, Move window to workspace 6 silently, movetoworkspacesilent, 6
bindd = SUPER ALT, 7, Move window to workspace 7 silently, movetoworkspacesilent, 7
bindd = SUPER ALT, 8, Move window to workspace 8 silently, movetoworkspacesilent, 8
bindd = SUPER ALT, 9, Move window to workspace 9 silently, movetoworkspacesilent, 9
bindd = SUPER ALT, 0, Move window to workspace 10 silently, movetoworkspacesilent, 10


# TODO: Integrate caelestia properly
# TODO: set caelestia windrules in windrules.conf
# ====================== Caelestia Bindings ======================

exec = hyprctl dispatch submap global
submap = global

# ## Shell keybinds
# Launcher
bindd = Super, Space, Open Caelestia launcher, global, caelestia:launcher

# Misc
bindd = Ctrl+Alt, Delete, Open session menu, global, caelestia:session
bindld = Ctrl+Alt, C , Clear notifications, global, caelestia:clearNotifs
bindd = Super+Shift, P, Show all windows, global, caelestia:showall
bindd = Super, L, Lock screen, global, caelestia:lock

# Restore lock # TODO: why it is needed?
bindld = Super Alt, L, Restore Caelestia shell, exec, caelestia shell -d
bindld = Super Alt, L, Lock screen (restore), global, caelestia:lock

# Brightness
bindld = , XF86MonBrightnessUp, Increase brightness, global, caelestia:brightnessUp
bindld = , XF86MonBrightnessDown, Decrease brightness, global, caelestia:brightnessDown

# Media
# TODO: organize and add description
bindld = Ctrl+Super, Space, Toggle media playback, global, caelestia:mediaToggle
bindld = Ctrl+Super, Equal, Next media track, global, caelestia:mediaNext
bindld = Ctrl+Super, Minus, Previous media track, global, caelestia:mediaPrev

bindld = , XF86AudioPlay, Toggle media playback, global, caelestia:mediaToggle
bindld = , XF86AudioPause, Toggle media playback, global, caelestia:mediaToggle
bindld = , XF86AudioNext, Next media track, global, caelestia:mediaNext
bindld = , XF86AudioPrev, Previous media track, global, caelestia:mediaPrev
bindld = , XF86AudioStop, Stop media playback, global, caelestia:mediaStop

# Restart caelestia
bindrd = Ctrl+Super+Alt, R, Restart Caelestia shell, exec, qs -c caelestia kill;sleep 0.1; caelestia shell -d

# Window actions
bindd = Super, left, Move focus left, movefocus, l
bindd = Super, right, Move focus right, movefocus, r
bindd = Super, up, Move focus up, movefocus, u
bindd = Super, down, Move focus down, movefocus, d
bindd = Super+Shift, left, Move window left, movewindow, l
bindd = Super+Shift, right, Move window right, movewindow, r
bindd = Super+Shift, up, Move window up, movewindow, u
bindd = Super+Shift, down, Move window down, movewindow, d
binded = Super, Minus, Decrease split ratio, splitratio, -0.1
binded = Super, Equal, Increase split ratio, splitratio, 0.1
bindmd = Super, mouse:272, Move window with mouse, movewindow
bindmd = Super, Z, Move window with Z key, movewindow
bindmd = Super, mouse:273, Resize window with mouse, resizewindow
bindmd = Super, X, Resize window with X key, resizewindow
bindd = Ctrl+Super, Backslash, Center window, centerwindow, 1
bindd = Ctrl+Super+Alt, Backslash, Resize window to 55% x 70%, resizeactive, exact 55% 70%
bindd = Ctrl+Super+Alt, Backslash, Center resized window, centerwindow, 1
bindd = Super+Alt, Backslash, Picture-in-picture mode, exec, caelestia resizer pip  # Move window to picture-in-picture mode
bindd = Super, P, Pin window, pin
bindd = Super, F, Fullscreen window, fullscreen, 0
bindd = Super+Alt, F, Fullscreen with borders, fullscreen, 1  # Fullscreen with borders
bindd = Super+Alt, Space, Toggle floating window, togglefloating, # TODO: Change to Super+Alt Space
bindd = SUPER, Q, Close window, killactive

# Special workspace toggles
bindd = Ctrl+Shift, Escape, Toggle system monitor workspace, exec, caelestia toggle sysmon
bindd = Super, M, Toggle music workspace, exec, caelestia toggle music
bindd = Super, D, Toggle communication workspace, exec, caelestia toggle communication
bindd = Super, R, Toggle todo workspace, exec, caelestia toggle todo

# Apps
bindd = SUPER, RETURN, Terminal, exec, app2unit -- kitty --working-directory="$(omarchy-cmd-terminal-cwd)" #TODO: remove omarchy
# TODO: use below keybinds
bindd = Super, W, Switch to browser workspace, workspace, 2 # Move to browser workspace # TODO: use proper browser launch
bindd = Super, C, Open editor, exec, app2unit -- $editor
$fileExplorer = nautilus # TODO: move to variables.conf
bindd = Super, E, Open file explorer, exec, app2unit -- $fileExplorer
bindd = Ctrl+Alt, Escape, Open btop in terminal, exec, kitty btop
bindd = Ctrl+Alt, V, Open audio control panel, exec, app2unit -- pavucontrol

# Screenshots and screen recording
# TODO: organize and add description, maybe change to good keybinds
bindld = , Print, Capture full screen to clipboard, exec, caelestia screenshot  # Full screen capture > clipboard
bindd = Super, Print, Capture region (freeze screen), global, caelestia:screenshotFreeze  # Capture region (freeze)
bindd = Super+Shift, Print, Capture region, global, caelestia:screenshot  # Capture region
bindd = Super+Shift, C, Color picker, exec, hyprpicker -a  # Colour picker

# TODO: maybe enable recording in future? i guess obs is good for now
# bind = Super+Alt, R, exec, caelestia record -s  # Record screen with sound
# bind = Ctrl+Alt, R, exec, caelestia record  # Record screen
# bind = Super+Shift+Alt, R, exec, caelestia record -r  # Record region

# Volume
bindld = , XF86AudioMicMute, Toggle microphone mute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindld = , XF86AudioMute, Toggle audio mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
$volumeUnmuteCmd = wpctl set-mute @DEFAULT_AUDIO_SINK@ 0
$volumeStep = 5
bindled = , XF86AudioRaiseVolume, Increase volume, exec, $volumeUnmuteCmd; wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ $volumeStep%+
bindled = , XF86AudioLowerVolume, Decrease volume, exec, $volumeUnmuteCmd; wpctl set-volume @DEFAULT_AUDIO_SINK@ $volumeStep%-

# Precise 1% multimedia adjustments with Alt modifier
bindeld = ALT, XF86AudioRaiseVolume, Volume up precise, exec, $volumeUnmuteCmd; wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 1%+
bindeld = ALT, XF86AudioLowerVolume, Volume down precise, exec, $volumeUnmuteCmd; wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-


# Sleep TODO: use this
# bind = Super+Shift, L, exec, systemctl suspend-then-hibernate


# Clipboard, Emoji picker, Walker Launcher and Menus
bindd = Super, V, Clipboard manager, exec, walker -m clipboard # Clipboard manager
bindd = Super, Period, Emoji/Symbols picker, exec, walker -m symbols  # Emoji picker
bindd = Alt, Space, Open walker launcher, exec, walker
bindd = SUPER, K, Show key bindings, exec, ~/.config/hypr/scripts/walker-keybinds



# ===================== Omarchy keybinds moved here =====================

# ========= Tiling =========
# TAB between workspaces # TODO: good keybinds
bindd = SUPER, TAB, Next workspace, workspace, e+1
bindd = SUPER SHIFT, TAB, Previous workspace, workspace, e-1
bindd = SUPER CTRL, TAB, Former workspace, workspace, previous

# TODO: try out groups

# Toggle groups
bindd = SUPER, G, Toggle window grouping, togglegroup
bindd = SUPER ALT, G, Move active window out of group, moveoutofgroup

# Join groups
bindd = SUPER ALT, LEFT, Move window to group on left, moveintogroup, l
bindd = SUPER ALT, RIGHT, Move window to group on right, moveintogroup, r
bindd = SUPER ALT, UP, Move window to group on top, moveintogroup, u
bindd = SUPER ALT, DOWN, Move window to group on bottom, moveintogroup, d

# Navigate a single set of grouped windows
bindd = SUPER ALT, TAB, Next window in group, changegroupactive, f
bindd = SUPER ALT SHIFT, TAB, Previous window in group, changegroupactive, b

# Window navigation for grouped windows
bindd = SUPER CTRL, LEFT, Move grouped window focus left, changegroupactive, b
bindd = SUPER CTRL, RIGHT, Move grouped window focus right, changegroupactive, f

# Scroll through a set of grouped windows with SUPER + ALT + scroll
bindd = SUPER ALT, mouse_down, Next window in group, changegroupactive, f
bindd = SUPER ALT, mouse_up, Previous window in group, changegroupactive, b

# Activate window in a group by number
bindd = SUPER ALT, code:10, Switch to group window 1, changegroupactive, 1
bindd = SUPER ALT, code:11, Switch to group window 2, changegroupactive, 2
bindd = SUPER ALT, code:12, Switch to group window 3, changegroupactive, 3
bindd = SUPER ALT, code:13, Switch to group window 4, changegroupactive, 4
bindd = SUPER ALT, code:14, Switch to group window 5, changegroupactive, 5

# XXX: Group ends


