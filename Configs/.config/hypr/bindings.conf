# Application bindings
$browser = omarchy-launch-browser

# Browser workspace rule - auto-launch browser on workspace 2
workspace=2,on-created-empty:$browser # make script to get list of cmdd to try if first one fails

# ====================== My Custom ======================

# Switch workspaces with SUPER + [1-9]
bindd = SUPER, 1, Switch to workspace 1, workspace, 1
bindd = SUPER, 2, Switch to workspace 2, workspace, 2
bindd = SUPER, 3, Switch to workspace 3, workspace, 3
bindd = SUPER, 4, Switch to workspace 4, workspace, 4
bindd = SUPER, 5, Switch to workspace 5, workspace, 5
bindd = SUPER, 6, Switch to workspace 6, workspace, 6
bindd = SUPER, 7, Switch to workspace 7, workspace, 7
bindd = SUPER, 8, Switch to workspace 8, workspace, 8
bindd = SUPER, 9, Switch to workspace 9, workspace, 9
bindd = SUPER, 0, Switch to workspace 10, workspace, 10

# Move active window to a workspace with SUPER + SHIFT + [1-9]
bindd = SUPER SHIFT, 1, Move window to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, 2, Move window to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, 3, Move window to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, 4, Move window to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, 5, Move window to workspace 5, movetoworkspace, 5
bindd = SUPER SHIFT, 6, Move window to workspace 6, movetoworkspace, 6
bindd = SUPER SHIFT, 7, Move window to workspace 7, movetoworkspace, 7
bindd = SUPER SHIFT, 8, Move window to workspace 8, movetoworkspace, 8
bindd = SUPER SHIFT, 9, Move window to workspace 9, movetoworkspace, 9
bindd = SUPER SHIFT, 0, Move window to workspace 10, movetoworkspace, 10



# Move/Switch to special workspace (scratchpad) # TODO: add more special workspaces like steam, game, music, etc
# Example special workspace (scratchpad)
bindd = SUPER, S, Toggle scratchpad workspace, togglespecialworkspace, magic
bindd = SUPER SHIFT, S, Move window to scratchpad, movetoworkspace, special:magic



# Media control
# # Requires playerctl
bindld = , XF86AudioNext, Next media track, exec, playerctl next
bindld = , XF86AudioPause, Pause media, exec, playerctl play-pause
bindld = , XF86AudioPlay, Play media, exec, playerctl play-pause
bindld = , XF86AudioPrev, Previous media track, exec, playerctl previous
bindd = SUPER, Escape, Toggle media play/pause, exec, playerctl play-pause # pause/play media, for laptop

bindsd = ALT_R, Right, Next media track (laptop), exec, playerctl next # next media with right alt and right arrow, for laptop
bindsd = ALT_R, Left, Previous media track (laptop), exec, playerctl previous # previous media with right alt and left arrow, for laptop
bindsd = ALT_R, Escape, Toggle media play/pause (laptop), exec, playerctl play-pause # pause/play media with right alt and escape, for laptop


# ====================== Additional Custom Bindings ======================

# Additional application shortcuts (merged from nixos-dotfiles)
bindd = CTRL SHIFT, Escape, Open btop system monitor, exec, btop

# Move active window around workspace with SUPER + SHIFT + CTRL + arrows
$moveactivewindow=grep -q "true" <<< $(hyprctl activewindow -j | jq -r .floating) && hyprctl dispatch moveactive
binded = SUPER SHIFT CTRL, left, Move activewindow to the left, exec, $moveactivewindow -30 0 || hyprctl dispatch movewindow l
binded = SUPER SHIFT CTRL, right, Move activewindow to the right, exec, $moveactivewindow 30 0 || hyprctl dispatch movewindow r
binded = SUPER SHIFT CTRL, up, Move activewindow up, exec, $moveactivewindow  0 -30 || hyprctl dispatch movewindow u
binded = SUPER SHIFT CTRL, down, Move activewindow down, exec, $moveactivewindow 0 30 || hyprctl dispatch movewindow d

# Move focused window to workspace silently
bindd = SUPER ALT, 1, Move window to workspace 1 silently, movetoworkspacesilent, 1
bindd = SUPER ALT, 2, Move window to workspace 2 silently, movetoworkspacesilent, 2
bindd = SUPER ALT, 3, Move window to workspace 3 silently, movetoworkspacesilent, 3
bindd = SUPER ALT, 4, Move window to workspace 4 silently, movetoworkspacesilent, 4
bindd = SUPER ALT, 5, Move window to workspace 5 silently, movetoworkspacesilent, 5
bindd = SUPER ALT, 6, Move window to workspace 6 silently, movetoworkspacesilent, 6
bindd = SUPER ALT, 7, Move window to workspace 7 silently, movetoworkspacesilent, 7
bindd = SUPER ALT, 8, Move window to workspace 8 silently, movetoworkspacesilent, 8
bindd = SUPER ALT, 9, Move window to workspace 9 silently, movetoworkspacesilent, 9
bindd = SUPER ALT, 0, Move window to workspace 10 silently, movetoworkspacesilent, 10


