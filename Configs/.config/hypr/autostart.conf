# Extra autostart processes
# exec-once = uwsm-app -- my-service

exec-once = nm-applet
exec-once = uwsm-app -- env GDK_SCALE=1 equibop & 
exec-once = uwsm-app -- voxtype --eager-processing #daemon # voice dictation
exec-once = /usr/lib/polkit-kde-authentication-agent-1 || polkit-authentication-agent-1 # polkit agent for authentication
exec-once = sleep 3 && udiskie --appindicator -s -a -n --no-menu-checkbox-workaround # auto-mount with smart tray

# TODO: use uwsm-app for these or maybe remove uwsm dependency???????
exec-once = dms run -d # DankMaterialShell
# exec-once = $caelestiaStarter # TODO: remove this
# ================= Omarchy default autostart apps =================
# TODO: hmm maybe remove those if not needed

# TODO: it looks good and also appear in fullscreen so i should use this...
exec-once = uwsm-app -- swayosd-server &> /tmp/swayosd-server.log # TODO: remove and set keybinds for volume, brightness OSDs, etc. in hyprland. if i remove this now, i wont have keybind to change things. caelestia dont add keybinds. because they have caelestia dot for those settings and i dont want to use their hyprland config and bloat agan ahahhaha

exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Slow app launch fix -- set systemd vars
exec-once = systemctl --user import-environment $(env | cut -d'=' -f 1)
exec-once = dbus-update-activation-environment --systemd --all


exec-once = uwsm-app -- wl-paste cliphist store
exec-once = walker --gapplication-service
