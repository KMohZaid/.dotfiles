# Control your input devices
# See https://wiki.hypr.land/Configuring/Variables/#input
input {
  # Use multiple keyboard layouts and switch between them with Left Alt + Right Alt
  # kb_layout = us,dk,eu
  kb_layout = us
  # kb_options = compose:caps # ,grp:shifts_toggle
  kb_options = grp:shifts_toggle # TODO: some day, maybe use caps lock as compose key?


  # Change speed of keyboard repeat
  repeat_rate = 40
  repeat_delay = 600

  # Start with numlock on by default
  numlock_by_default = true

  # Increase sensitivity for mouse/trackpad (default: 0)
  # sensitivity = 0.35

  touchpad {
    # Use natural (inverse) scrolling
    natural_scroll = true

    # Use two-finger clicks for right-click instead of lower-right corner
    # clickfinger_behavior = true

    # Control the speed of your scrolling
    scroll_factor = 0.4
  }
}

# https://wiki.hyprland.org/Configuring/Variables/#input
misc {
    key_press_enables_dpms = true  # key press will trigger wake
    mouse_move_enables_dpms = true # mouse move will trigger wake
}

# Scroll nicely in the terminal TODO: good one
windowrule = scroll_touchpad 1.5, match:class (Alacritty|kitty)
windowrule = scroll_touchpad 0.2, match:class com.mitchellh.ghostty

#  TODO: make window rules file?

# Window rules merged from nixos-dotfiles
# Idle inhibitors - prevent swayidle/hypridle from locking screen for fullscreen windows
windowrule = idle_inhibit fullscreen, match:fullscreen 1 # when watching videos in fullscreen

# Application workspace assignments
windowrule = workspace 3 silent,match:class ^(discord|vesktop)$ # Discord/Vesktop to workspace 3

# Enable touchpad gestures for changing workspaces
# See https://wiki.hyprland.org/Configuring/Gestures/
# gesture = 3, horizontal, workspace
