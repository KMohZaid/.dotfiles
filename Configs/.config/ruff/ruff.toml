# Ruff configuration for Python linting and formatting
# formatter + Linter + isort
# Editor Settings: https://docs.astral.sh/ruff/editors/settings/
# Ruff configuration settings: https://docs.astral.sh/ruff/settings/
# Inline guide from: https://docs.astral.sh/ruff/editors/settings/#configuration_resolution_order

# Line length for both linter and formatter
line-length = 80

# Linter configuration
[lint]
# Enable preview mode for experimental rules
#preview = true

# i will not add 'select' property to use default select, and using extend-select to add more codes i want
extend-select = [ # check why E dont give bare exception warning
    "A",       # Builtin shadowing
    "B",       # flake8-bugbear (common mistakes)
    "E",       # pycodestyle errors
    "F",       # pyflakes
    "W",       # pycodestyle warnings
    "N",       # pep8-naming
    "I",       # isort (import sorting)
    "ASYNC",   # async-related checks
    "TID251",  # banned API imports
]

# Ignore specific rules
ignore = [
    "E501", # line too long
]

# Per-file rule ignores
[lint.per-file-ignores]
# Ignore unused imports in __init__.py files, because they are re-exported for other modules to access
"__init__.py" = ["F401"]

# Formatter configuration
[format]
preview = true

# TODO: wait for https://github.com/astral-sh/ruff/issues/6514 or https://github.com/astral-sh/ruff/pull/22212
# isort float to top feature not yet supported

